name: archy-next
services:
  web:
    build: .
    image: archy-next:local
    init: true
    restart: unless-stopped
    env_file: .env.production
    ports:
      - '127.0.0.1:3000:3000'
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 1g
    pids_limit: 128
    stop_grace_period: 30s
